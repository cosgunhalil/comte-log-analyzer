[package]
name = "comte-app"
description = "Comte Log Analyzer desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "comte_app"
path = "src/lib.rs"

# The desktop app (a GUI program on Windows: no console window).
[[bin]]
name = "comte-log-analyzer"
path = "src/main.rs"

# The command line.
[[bin]]
name = "comte"
path = "src/bin/comte.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
comte-core.workspace = true
comte-unity.workspace = true
crc32fast = "1.5.4"
directories = "6.0.0"
eframe = "0.37"
flate2 = "1.1.11"
png = "0.18"
regex.workspace = true
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[build-dependencies]
png = "0.18"
winresource = "0.1.34"
