[package]
name = "comte-app"
description = "Comte Logger desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "comte-logger"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
comte-core.workspace = true
comte-unity.workspace = true
directories = "6.0.0"
eframe = "0.37"
png = "0.18"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
