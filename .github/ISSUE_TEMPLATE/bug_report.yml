name: Bug report
description: Something in Comte Log Analyzer is broken (a crash, a wrong button, a dialog that fails)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a log is shown wrongly (missed errors, wrong sections, a wrong verdict), use the **Log isn't read correctly** template instead.
        Security problems, such as a value the redaction misses, go to [private reporting](https://github.com/cosgunhalil/comte-log-analyzer/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: The app closed when I clicked Save pack… on a Player log.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Open Player.log from the left panel
        2. Click 📦 Pack… in the toolbar
        3. Click Save pack…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Comte Log Analyzer version
      description: The release you downloaded, or the file properties of comte-log-analyzer.exe.
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
