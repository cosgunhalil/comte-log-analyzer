# Release pipeline. Pushing a version tag (v0.1.3, v1.2.3, …) tests and builds
# the Windows binaries and publishes a GitHub Release with two downloads:
#   comte-log-analyzer-vX.Y.Z-windows-x64.exe  the app, ready to run
#   comte-log-analyzer-vX.Y.Z-windows-x64.zip  the app, the comte CLI, README and licences
# The release text is the version's section of CHANGELOG.md, which
# scripts/release.ps1 writes when it bumps the version and creates the tag.

name: Release

on:
  push:
    tags: ["v*"]

# contents: create the release and upload the files.
# id-token + attestations: sign build provenance for the files.
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The tag must name the version the binaries report. scripts/release.ps1
      # bumps the version and tags the same commit, so this only trips when a
      # tag is pushed by hand before the bump.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'comte-app' | Select-Object -ExpandProperty version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error ("Tag ${{ github.ref_name }} does not match Cargo.toml version $version. " +
              "Cut releases with scripts/release.ps1, which bumps the version and tags the same commit.")
            exit 1
          }

      # Never ship from a commit that fails the suite, even if CI was skipped.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "comte-log-analyzer-${{ github.ref_name }}-windows-x64"
          Copy-Item target/release/comte-log-analyzer.exe "$name.exe"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/comte-log-analyzer.exe, target/release/comte.exe, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $override = "docs/release-notes/$tag.md"
          if (Test-Path $override) {
            Copy-Item $override release-notes.md
            exit 0
          }
          # The version's section of CHANGELOG.md, without its heading.
          $version = $tag.Substring(1)
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -SimpleMatch "## [$version]" | Select-Object -First 1).LineNumber
          $section = @()
          if ($start) {
            foreach ($line in $lines[$start..($lines.Count - 1)]) {
              if ($line.StartsWith('## [')) { break }
              $section += $line
            }
          }
          $section = (($section -join "`n").Trim()) -split "`n"
          if (-not ($section -join '').Trim()) { $section = @("See the commits since the previous release.") }
          $notes = @(
            "**Windows only.** Download ``$env:ASSET_NAME.exe`` and run it, or the ``.zip``, which also has the ``comte`` command line, the README and the licences.",
            "",
            "The files aren't code-signed yet, so Windows may ask you to confirm the first time. Check a download came from this repository's CI with ``gh attestation verify <file> --repo ${{ github.repository }}``.",
            ""
          ) + $section
          $notes | Set-Content release-notes.md -Encoding utf8

      # Signed provenance: anyone can verify the files were built by this
      # workflow from this repository (gh attestation verify <file> --repo <owner/repo>).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.ASSET_NAME }}.exe
            ${{ env.ASSET_NAME }}.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "$env:ASSET_NAME.exe" "$env:ASSET_NAME.zip"
          --title "Comte Log Analyzer ${{ github.ref_name }}"
          --notes-file release-notes.md
