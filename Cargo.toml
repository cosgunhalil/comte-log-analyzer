[workspace]
resolver = "3"
members = ["crates/comte-core", "crates/comte-unity", "crates/comte-app"]
default-members = ["crates/comte-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Halil Cosgun"]
description = "Comte Logger: a human-friendly log analyzer for game engines."

[workspace.dependencies]
comte-core = { path = "crates/comte-core" }
comte-unity = { path = "crates/comte-unity" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
