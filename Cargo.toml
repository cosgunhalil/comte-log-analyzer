[workspace]
resolver = "3"
members = ["crates/comte-core", "crates/comte-unity", "crates/comte-app"]
default-members = ["crates/comte-app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
authors = ["Halil Cosgun"]
description = "Comte Log Analyzer: a human-friendly log analyzer for game engines."
license = "MIT OR Apache-2.0"
repository = "https://github.com/cosgunhalil/comte-log-analyzer"
homepage = "https://github.com/cosgunhalil/comte-log-analyzer"
keywords = ["unity", "log-analyzer", "gamedev", "crash", "debugging"]
categories = ["development-tools", "game-development"]

[workspace.dependencies]
comte-core = { path = "crates/comte-core" }
comte-unity = { path = "crates/comte-unity" }
regex = "1.13.1"
insta = "1.49.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info is stripped but the symbol table is kept, and LTO is thin rather
# than fat: fully stripped, densely fused binaries look "packed" to antivirus
# machine-learning checks and draw false positives (see RELEASING.md).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
